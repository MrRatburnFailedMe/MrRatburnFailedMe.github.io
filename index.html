<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Harun's game portfolio: Learn to Mine, Cops vs Dino, Make It to the Moon and Zoo Tycoon. Free to play in your browser.">
<meta property="og:title" content="Harun's Games">
<meta property="og:description" content="Harun's game portfolio: Learn to Mine, Cops vs Dino, Make It to the Moon and Zoo Tycoon. Free to play in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mrratburnfailedme.github.io/">
<title>Harun's Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Outfit:wght@400;500;600&display=swap">
<style>
  /* Layout: an arcade shelf. One quiet header, then four game "cartridges" in a 2x2 grid,
     each with its own pixel-art cover world. Single dark look on purpose. */
  :root {
    color-scheme: dark;
    --bg: #14122b;
    --bg-raised: #1e1b3d;
    --line: #35306a;
    --fg: #f1eeff;
    --fg-soft: #b1abd6;
    --accent: #ffcb47;
    --accent-ink: #2a1d00;
    --font-display: "Silkscreen", "Courier New", monospace;
    --font-body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding-block: 48px 40px; display: flex; flex-direction: column; gap: 40px; }

  header { display: flex; flex-direction: column; gap: 12px; }
  .eyebrow { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 7vw, 64px); line-height: 1.05; margin: 0; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .lede { color: var(--fg-soft); max-width: 52ch; margin: 0; font-size: 19px; }

  .shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  @media (max-width: 700px) { .shelf { grid-template-columns: minmax(0, 1fr); } }

  .game { background: var(--bg-raised); border: 2px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; transition: transform .15s ease, border-color .15s ease; }
  .game:hover { transform: translateY(-4px); border-color: var(--accent); }

  .cover { position: relative; aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; overflow: hidden; }
  .cover canvas { height: 62%; width: auto; image-rendering: pixelated; image-rendering: crisp-edges; position: relative; filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)); }

  /* Mining: rock strata with ore specks */
  .cover.mine { background:
    radial-gradient(circle at 14% 30%, #5fe3ff 0 5px, transparent 6px),
    radial-gradient(circle at 82% 22%, #ffcb47 0 6px, transparent 7px),
    radial-gradient(circle at 88% 74%, #5fe3ff 0 4px, transparent 5px),
    radial-gradient(circle at 22% 80%, #ffcb47 0 5px, transparent 6px),
    linear-gradient(#6b4a35 0 25%, #57392a 25% 50%, #442b21 50% 75%, #33201a 75%); }
  /* Dino vs Cops: siren lights */
  .cover.dino { background: linear-gradient(90deg, #c2263a 0 50%, #2647c2 50%); }
  .cover.dino::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #2647c2 0 50%, #c2263a 50%); animation: siren 1.2s steps(1) infinite; }
  .cover.dino::after { content: ""; position: absolute; inset: auto 0 0; height: 16%; background: #23232b; border-top: 4px dashed #f1eeff; }
  @keyframes siren { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
  /* Moon: stars and the destination */
  .cover.moon { background:
    radial-gradient(circle at 84% 24%, #f4f0d8 0 34px, transparent 35px),
    radial-gradient(circle at 12% 20%, #fff 0 2px, transparent 3px),
    radial-gradient(circle at 30% 62%, #fff 0 2px, transparent 3px),
    radial-gradient(circle at 66% 78%, #fff 0 2px, transparent 3px),
    radial-gradient(circle at 48% 14%, #fff 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 92% 66%, #fff 0 1.5px, transparent 2.5px),
    linear-gradient(#0b0a24, #2b1b5e); }
  /* Zoo: sky over grass */
  .cover.zoo { background: linear-gradient(#7fd4f5 0 68%, #4fae4a 68% 84%, #3c8f3a 84%); }

  .info { padding: 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .info h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance; }
  .info p { margin: 0; color: var(--fg-soft); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
  .tags li { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-soft); border: 1px solid var(--line); padding: 3px 8px; border-radius: 3px; }
  .play { margin-top: auto; align-self: flex-start; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; background: var(--accent); color: var(--accent-ink); padding: 10px 18px; border-radius: 4px; box-shadow: 0 4px 0 #a87a00; }
  .play:hover { filter: brightness(1.08); }
  .play:active { transform: translateY(3px); box-shadow: 0 1px 0 #a87a00; }
  .play:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  .play.soon { background: transparent; color: var(--fg-soft); border: 2px dashed var(--line); box-shadow: none; cursor: default; }

  footer { color: var(--fg-soft); font-size: 15px; border-top: 2px solid var(--line); padding-top: 20px; }

  @media (prefers-reduced-motion: reduce) {
    .cover.dino::before { animation: none; opacity: 0; }
    .game { transition: none; }
    .game:hover { transform: none; }
  }
</style>
<style>body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Game portfolio · 4 games</div>
    <h1>Harun's <span>Games</span></h1>
    <p class="lede">I'm Harun and I make games. These are the ones I've built so far. Pick one and press play.</p>
  </header>

  <main class="shelf" id="shelf"></main>

  <footer>Made by Harun. More games on the way.</footer>
</div>

<script>
  // ─────────────────────────────────────────────────────────────
  // EDIT HERE: paste each game's link into "url" (leave "" to show "Coming soon").
  // You can also change the name, blurb and tags.
  // ─────────────────────────────────────────────────────────────
  const GAMES = [
    {
      name: "Learn to Mine",
      url: "https://mrratburnfailedme.github.io/learn-to-mine/",
      blurb: "California, 1851. Work the Sierra Nevada caves for ore, pan the river for gold and sell your haul to buy better tools.",
      tags: ["Gold Rush", "Mining", "3D"],
      cover: "mine", sprite: "pickaxe"
    },
    {
      name: "Cops vs Dino",
      url: "https://mrratburnfailedme.github.io/dino-muncher/",
      blurb: "One dinosaur, a whole police force on its tail. How long can you stay loose?",
      tags: ["Action", "Chase"],
      cover: "dino", sprite: "dino"
    },
    {
      name: "Make It to the Moon",
      url: "https://mrratburnfailedme.github.io/make-it-to-the-moon/",
      blurb: "Launch, boost and keep climbing until the moon is under your feet.",
      tags: ["Space", "Launch"],
      cover: "moon", sprite: "rocket"
    },
    {
      name: "Zoo Tycoon",
      url: "https://claude.ai/artifact/6vWfTMn5quWebk7PbrXfyP",
      blurb: "Build enclosures, bring in animals and grow a zoo that visitors love.",
      tags: ["Tycoon", "Management"],
      cover: "zoo", sprite: "lion"
    }
  ];

  // Pixel-art covers: each letter is one pixel of that color, "." is empty.
  const COLORS = { h: "#a8703d", m: "#cfd6e4", g: "#5fd35a", k: "#15131f", w: "#f4f4fa", b: "#59c8ff", r: "#e8413f", o: "#f08a24", y: "#ffd23f" };
  const SPRITES = {
    pickaxe: [
      "..mmmmmm....",
      ".mm...mmmm..",
      "m.......hmm.",
      ".......hh.mm",
      "......hh...m",
      ".....hh....m",
      "....hh......",
      "...hh.......",
      "..hh........",
      ".hh.........",
      "hh.........."
    ],
    dino: [
      ".......ggggg..",
      "......ggkgggg.",
      "......ggggggg.",
      "......gggg....",
      "......gggggg..",
      "g....gggg.....",
      "g...gggggg....",
      "gg.ggggggg.g..",
      "gggggggggg....",
      ".ggggggggg....",
      "..ggggggg.....",
      "...gg.gg......",
      "...g...g......",
      "...gg..gg....."
    ],
    rocket: [
      "....ww....",
      "...wwww...",
      "...wbbw...",
      "..wwbbww..",
      "..wwwwww..",
      "..wwwwww..",
      "..wwwwww..",
      ".rwwwwwwr.",
      "rrwwwwwwrr",
      "rr.wwww.rr",
      "...oyyo...",
      "....yy....",
      "....oo...."
    ],
    lion: [
      "..oooooooo..",
      ".oooooooooo.",
      "ooyyyyyyyyoo",
      "ooykyyyykyoo",
      "ooyyyyyyyyoo",
      "ooyyykkyyyoo",
      "ooyywkkwyyoo",
      "ooyywwwwyyoo",
      ".ooyyyyyyoo.",
      "..oooooooo.."
    ]
  };

  function drawSprite(rows) {
    const c = document.createElement("canvas");
    c.width = Math.max(...rows.map(r => r.length));
    c.height = rows.length;
    const ctx = c.getContext("2d");
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
      if (COLORS[ch]) { ctx.fillStyle = COLORS[ch]; ctx.fillRect(x, y, 1, 1); }
    }));
    c.setAttribute("aria-hidden", "true");
    return c;
  }

  const shelf = document.getElementById("shelf");
  GAMES.forEach(g => {
    const card = document.createElement("article");
    card.className = "game";

    const cover = document.createElement("div");
    cover.className = "cover " + g.cover;
    cover.appendChild(drawSprite(SPRITES[g.sprite]));

    const info = document.createElement("div");
    info.className = "info";
    const h = document.createElement("h2"); h.textContent = g.name;
    const p = document.createElement("p"); p.textContent = g.blurb;
    const tags = document.createElement("ul"); tags.className = "tags";
    g.tags.forEach(t => { const li = document.createElement("li"); li.textContent = t; tags.appendChild(li); });

    let btn;
    if (g.url) {
      btn = document.createElement("a");
      btn.href = g.url; btn.target = "_blank"; btn.rel = "noopener";
      btn.className = "play"; btn.textContent = "▶ Play";
      btn.setAttribute("aria-label", "Play " + g.name);
    } else {
      btn = document.createElement("span");
      btn.className = "play soon"; btn.textContent = "Coming soon";
    }

    info.append(h, p, tags, btn);
    card.append(cover, info);
    shelf.appendChild(card);
  });
</script>
</body>
</html>
